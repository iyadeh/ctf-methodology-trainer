name: ctf-methodology-trainer

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:5434:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctf_trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctf_trainer_local}
      POSTGRES_DB: ${POSTGRES_DB:-ctf_methodology}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: